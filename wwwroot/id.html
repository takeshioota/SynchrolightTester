<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>行ID制御テスト — Synchrolight Tester</title>
  <link rel="stylesheet" href="/css/style.css">
</head>
<body>
  <header class="app-header">
    <div>
      <h1>行ID制御テスト</h1>
      <div class="sub">ID書込み済端末 動作デモ ①〜⑤</div>
    </div>
    <nav class="nav">
      <a href="/index.html" data-page="home">ホーム</a>
      <a href="/id.html" data-page="id">行ID制御テスト</a>
      <a href="/block.html" data-page="block">ブロックID制御テスト</a>
    </nav>
  </header>

  <main class="container">
    <div id="conn"></div>

    <!-- ① 色指定 -->
    <div class="panel">
      <h2>① 色指定 <span class="tag">ボタン押下で選択</span></h2>
      <p class="hint">赤・緑・青から選択します。この選択だけでは点灯しません。②③④⑤・点滅で使用する色になります。</p>
      <div id="colorPicker"></div>
    </div>

    <!-- 行ID制御 ②〜⑤ -->
    <div class="panel">
      <h2>行ID制御 <span class="tag">ID 001〜200</span></h2>
      <p class="hint">行ID（端末ID）単位で制御します（field=場次, コマンド AA）。</p>
      <div class="tiles">
        <button class="tile" id="btnSeqOn">
          <span class="num">②</span><span class="ttl">連続点灯</span>
          <span class="desc">ID001〜順次点灯（点灯済みは継続点灯）</span>
        </button>
        <button class="tile" id="btnSeqBlink">
          <span class="num">③</span><span class="ttl">連続点滅</span>
          <span class="desc">ID001〜1端末ずつ点滅し順次移動</span>
        </button>
        <button class="tile" id="btnOdd">
          <span class="num">④</span><span class="ttl">奇数点灯</span>
          <span class="desc">IDが奇数の端末のみ点灯</span>
        </button>
        <button class="tile" id="btnEven">
          <span class="num">⑤</span><span class="ttl">偶数点灯</span>
          <span class="desc">IDが偶数の端末のみ点灯</span>
        </button>
      </div>

      <details style="margin-top:1rem">
        <summary class="hint" style="cursor:pointer">詳細設定（間隔）— 空欄はサーバ既定値</summary>
        <div class="row" style="margin-top:.6rem">
          <label class="field">連続点灯の間隔(ms)
            <input id="seqInterval" type="number" min="0" step="50" placeholder="500">
          </label>
          <label class="field">連続点滅の点灯時間(ms)
            <input id="blinkOn" type="number" min="0" step="50" placeholder="500">
          </label>
        </div>
      </details>
    </div>

    <!-- 共通操作 -->
    <div class="panel">
      <h2>共通操作</h2>
      <div class="tiles">
        <button class="tile warn" id="btnBlink">
          <span class="num">●</span><span class="ttl">点滅</span>
          <span class="desc">選択色で全体を点滅（0.5秒点灯/0.5秒消灯）</span>
        </button>
        <button class="tile danger" id="btnOff">
          <span class="num">■</span><span class="ttl">全消灯</span>
          <span class="desc">実行中デモを停止し全消灯</span>
        </button>
      </div>
    </div>

    <!-- 状態 -->
    <div class="panel">
      <h2>実行状態</h2>
      <div id="running" class="running"></div>
      <div id="log" class="log"></div>
    </div>
  </main>

  <script src="/js/common.js"></script>
  <script>
    markNav('id');
    initLog(document.getElementById('log'));
    renderConnectionBar(document.getElementById('conn'));
    renderColorPicker(document.getElementById('colorPicker'));
    initRunning(document.getElementById('running'));

    const numOrNull = (el) => { const v = el.value.trim(); return v === '' ? null : parseInt(v, 10); };

    document.getElementById('btnSeqOn').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '連続点灯', () =>
        api('/api/demo/sequential-on', { body: { color: currentColor(), intervalMs: numOrNull(document.getElementById('seqInterval')) } })));

    document.getElementById('btnSeqBlink').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '連続点滅', () =>
        api('/api/demo/sequential-blink', { body: { color: currentColor(), onMs: numOrNull(document.getElementById('blinkOn')) } })));

    document.getElementById('btnOdd').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '奇数点灯', () => api('/api/demo/odd', { body: { color: currentColor() } })));

    document.getElementById('btnEven').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '偶数点灯', () => api('/api/demo/even', { body: { color: currentColor() } })));

    document.getElementById('btnBlink').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '点滅', () => api('/api/demo/blink', { body: { color: currentColor() } })));

    document.getElementById('btnOff').addEventListener('click', (e) =>
      runDemo(e.currentTarget, '全消灯', () => api('/api/demo/off', { body: {} })));
  </script>
</body>
</html>
